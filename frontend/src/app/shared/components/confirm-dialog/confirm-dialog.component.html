<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  {{ data.message }}
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button class="black-button" (click)="onCancel()">
    Cancel
  </button>

  <button mat-flat-button class="btn-primary" (click)="onConfirm()" cdkFocusInitial>
    {{ data.confirmText || 'Confirm' }}
  </button>
</mat-dialog-actions>
