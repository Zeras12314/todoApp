<h2 mat-dialog-title>Sign out</h2>

<mat-dialog-content>
  Are you sure you want to sign out? All unsaved changes will be lost.
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button mat-dialog-close class="black-button">Cancel</button>

  <button mat-flat-button class="btn-primary" mat-dialog-close cdkFocusInitial (click)="logout()">
    Sign out
  </button>
</mat-dialog-actions>
