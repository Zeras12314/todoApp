<div class="register container-fluid">
  <div class="row min-vh-100">
    <!-- LEFT SECTION -->
    <div class="col-lg-6 d-none d-lg-block register-branding p-0">
      <!-- background image -->
      <img src="/wallpaper.svg" alt="wallpaper" class="register-branding-bg" />

      <!-- centered logo -->
      <img src="/brand-logo.svg" alt="logo" class="register-branding-logo" />
    </div>

    <!-- RIGHT SECTION -->
    <div class="col-12 col-lg-6 register-form px-0">
      <div class="register-form-header d-lg-none">
        <img src="/brand-logo.svg" alt="logo" />
      </div>

      <div class="register-form-container">
        <h2>Create an account</h2>

        <form class="auth-form">
          <!-- Username -->
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Username</mat-label>
            <input matInput type="text" />
          </mat-form-field>

          <!-- Password -->
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Password</mat-label>

            <input matInput [type]="hide ? 'password' : 'text'" />

            <button
              mat-icon-button
              matSuffix
              type="button"
              (click)="hide = !hide"
              aria-label="Toggle password visibility"
            >
              <mat-icon>
                {{ hide ? 'visibility_off' : 'visibility' }}
              </mat-icon>
            </button>
          </mat-form-field>

          <!-- Validation Checklist -->
          <div class="validation-list d-none">
            <div class="validation-item">
              <mat-icon color="primary">check_circle</mat-icon>
              <span>At least 8 characters</span>
            </div>

            <div class="validation-item">
              <mat-icon color="primary">check_circle</mat-icon>
              <span>Contains uppercase letter</span>
            </div>

            <div class="validation-item">
              <mat-icon color="primary">check_circle</mat-icon>
              <span>Contains special character</span>
            </div>
          </div>

          <!-- CTA -->
          <button mat-raised-button color="primary" class="submit-btn">Sign In</button>
        </form>

        <div class="text-center">
          <h3 class="primary-black">Already have an account? <span class="primary-blue">Sign in</span></h3>
        </div>

        <!-- horizontal line OR horizontal line -->
        <div class="d-flex align-items-center my-4">
          <hr class="flex-grow-1" />
          <span class="mx-2 text-muted">OR</span>
          <hr class="flex-grow-1" />
        </div>

        <!-- Google CTA -->
        <div class="cta cta-wrapper">
          <button
            class="cta-google btn w-100 mb-2 d-flex align-items-center justify-content-center gap-2"
          >
            <img src="Icons/Google.svg" width="18" height="18" alt="google logo" />
            <span>Continue with Google</span>
          </button>

          <!-- Facebook CTA -->
          <button class="cta-fb btn w-100 d-flex align-items-center justify-content-center gap-2">
            <img src="Icons/Facebook.svg" width="18" height="18" alt="facebook logo" />
            <span>Continue with Facebook</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
