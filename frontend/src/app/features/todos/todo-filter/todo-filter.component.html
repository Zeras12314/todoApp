<div class="filter filter-wrapper">
  <!-- LEFT: filter trigger -->
  <div class="filter-content-left">
    <div class="filter-content-left-btn" (click)="toggleFilter()">
      <span class="filter-image">
        <img src="/Icons/Filter.svg" alt="filter icon" />
      </span>
      <span class="filter-text">Filter</span>
    </div>

    <div class="filter-content-left-chips">
      @if (selectedPriority()) {
        <img [src]="getPriorityChip(selectedPriority())" [alt]="selectedPriority() ?? ''" class="me-2" (click)="resetFilter('priority')"/>
      }

      @if (selectedStatus()) {
        <img [src]="getStatusChip(selectedStatus())" [alt]="selectedStatus() ?? ''" class="me-2" (click)="resetFilter('status')"/>
      }
    </div>
  </div>

  <!-- DROPDOWN — sibling of filter-content-left, anchored to .filter -->
  @if (isOpen()) {
    <div class="filter-dropdown" (click)="$event.stopPropagation()">
      <!-- PRIORITY -->
      <div class="filter-dropdown__group">
        <div class="filter-dropdown__item">
          <span>Priority</span>
          <mat-icon>chevron_right</mat-icon>
        </div>
        <div class="filter-dropdown__submenu">
          <div
            class="filter-dropdown__subitem"
            [class.active]="selectedPriority() === null"
            (click)="selectPriority(null)"
          >
            All
          </div>
          <div
            class="filter-dropdown__subitem"
            [class.active]="selectedPriority() === 'LOW'"
            (click)="selectPriority('LOW')"
          >
            Low
          </div>
          <div
            class="filter-dropdown__subitem"
            [class.active]="selectedPriority() === 'HIGH'"
            (click)="selectPriority('HIGH')"
          >
            High
          </div>
          <div
            class="filter-dropdown__subitem"
            [class.active]="selectedPriority() === 'CRITICAL'"
            (click)="selectPriority('CRITICAL')"
          >
            Critical
          </div>
        </div>
      </div>

      <!-- STATUS -->
      <div class="filter-dropdown__group">
        <div class="filter-dropdown__item">
          <span>Status</span>
          <mat-icon>chevron_right</mat-icon>
        </div>
        <div class="filter-dropdown__submenu">
          <div
            class="filter-dropdown__subitem"
            [class.active]="selectedStatus() === null"
            (click)="selectStatus(null)"
          >
            All
          </div>
          <div
            class="filter-dropdown__subitem"
            [class.active]="selectedStatus() === 'NOT_STARTED'"
            (click)="selectStatus('NOT_STARTED')"
          >
            Not Started
          </div>
          <div
            class="filter-dropdown__subitem"
            [class.active]="selectedStatus() === 'IN_PROGRESS'"
            (click)="selectStatus('IN_PROGRESS')"
          >
            In Progress
          </div>
          <div
            class="filter-dropdown__subitem"
            [class.active]="selectedStatus() === 'COMPLETED'"
            (click)="selectStatus('COMPLETED')"
          >
            Completed
          </div>
          <div
            class="filter-dropdown__subitem"
            [class.active]="selectedStatus() === 'CANCELLED'"
            (click)="selectStatus('CANCELLED')"
          >
            Cancelled
          </div>
        </div>
      </div>
    </div>
  }

  <!-- RIGHT: new task button -->
  <div class="filter-content-right" routerLink="/todos/new">
    <img src="/Buttons/Button_New Task.svg" alt="new task" />
  </div>
</div>

@if (isOpen()) {
  <div class="filter-backdrop" (click)="isOpen.set(false)"></div>
}
