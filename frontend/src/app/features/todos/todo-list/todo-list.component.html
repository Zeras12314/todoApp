@if (todo$ | async; as todos) {
  @for (todo of todos; track $index) {
    <h3>{{ todo.title }}</h3>
    <p>{{ todo.dueDate | date }}</p>
    <p>{{ todo.priority }}</p>
    <p>{{ todo.status }}</p>
  }
}
